name: Jules Daily PR Audit & Delegation Schedule

on:
  schedule:
    - cron: '0 8 * * *' # Run at 08:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  daily-sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r verification/requirements.txt pytest

      - name: Run Evidence Validation Sweep (Ralph Wiggum Loop Engine)
        run: |
          python scripts/evidence_validation_sweep.py

      - name: Upload Logs
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: jules-daily-logs
          path: LOCAL/logs/
