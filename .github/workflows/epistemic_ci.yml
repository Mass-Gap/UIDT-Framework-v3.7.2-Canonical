name: Epistemological Audit

on:
  pull_request:
    branches:
      - main
      - canonical

permissions:
  contents: read

jobs:
  epistemic-gatekeeper:
    name: Epistemic Gatekeeper
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run epistemic gatekeeper
        run: python scripts/epistemic_gatekeeper.py
