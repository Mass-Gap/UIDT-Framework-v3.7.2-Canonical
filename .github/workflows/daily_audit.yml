name: Daily PR Audit
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0 # needed to fetch other branches
      - name: Run Evidence Validation Sweep
        run: |
          ./scripts/evidence_validation_sweep.py
